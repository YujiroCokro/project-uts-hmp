<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-button routerLink="/produk/form">
    Tambah Produk
  </ion-button>
  <ion-item>
    <ion-input label="Cari Produk" labelPlacement="floating" [(ngModel)]="keyword">
    </ion-input>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let product of cariProduk();">
      <ion-thumbnail slot="start">
        <ion-img [src]="product.gambar || defaultImage"></ion-img>
      </ion-thumbnail>
      <ion-label routerLink="/produk/detail/{{product.id}}">
        <h2>{{ product.nama }}</h2>
        <p>Kategori: {{ product.kategori }}</p>
        <p>Harga Jual: Rp {{ product.hargaJual }}</p>
        <p>Stok: {{ product.stok }}</p>
      </ion-label>

      <ion-button routerLink="/produk/form/{{product.id}}">
        Edit
      </ion-button>
    </ion-item>
  </ion-list>
  <ion-button expand="block" (click)="refresh()">
    Refresh
  </ion-button>
</ion-content>
