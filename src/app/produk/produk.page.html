<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-input
      label="Cari Produk"
      labelPlacement="floating"
      [(ngModel)]="keyword"
      (input)="filterProduk()">>
    </ion-input>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let product of products">
      <ion-label>
        <h2>{{ product.nama }}</h2>
        <p>Kategori: {{ product.kategori }}</p>
        <p>Harga Jual: Rp {{ product.hargaJual }}</p>
        <p>Stok: {{ product.stok }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
