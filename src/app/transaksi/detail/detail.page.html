<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/transaksi"></ion-back-button>
    </ion-buttons>
    <ion-title>Detail Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="transaksiDetail">
  <p><b>Waktu Transaksi:</b> {{ transaksiDetail.tanggal | date:'medium' }}</p>

  <ion-list>
    <ion-list-header>Daftar Item yang Dibeli:</ion-list-header>
    <ion-item *ngFor="let prod of transaksiDetail.items">
      <ion-label>
        <h3>{{ prod.nama }}</h3>
        <p>Kategori: {{ prod.kategori }}</p>
        <p>Harga: Rp {{ prod.hargaJual | number }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <h3><b>Total Pembayaran: Rp {{ transaksiDetail.total | number }}</b></h3>
  </div>
</ion-content>
