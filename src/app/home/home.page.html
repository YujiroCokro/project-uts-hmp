<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Dashboard</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-list>
    <ion-item>
      <ion-label>
        Jumlah Produk : {{ totalProduk }}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Total Transaksi Hari Ini : {{ totalTransaksi }}
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        Produk Terlaris : {{ produkTerlaris }}
      </ion-label>
    </ion-item>

  </ion-list>

</ion-content>
