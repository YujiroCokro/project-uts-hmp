<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Keranjang & Checkout</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="itemsKeranjang.length > 0">
    <ion-list-header>Daftar Belanjaan</ion-list-header>
    <ion-item-sliding *ngFor="let item of itemsKeranjang; let i = index">
      <ion-item>
        <ion-label>
          <h2>{{ item.nama }}</h2>
          <p>Kategori: {{ item.kategori }}</p>
          <p><b>Harga: Rp {{ item.hargaJual | number }}</b></p>
        </ion-label>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="hapusItem(i)">Hapus</ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <div *ngIf="itemsKeranjang.length === 0" class="ion-text-center ion-padding">
    <p>Keranjang kamu masih kosong.</p>
  </div>

  <div *ngIf="itemsKeranjang.length > 0" class="ion-padding">
    <h3><b>Total Belanja: Rp {{ hitungTotal() | number }}</b></h3>
    <ion-button expand="block" color="success" (click)="konfirmasiTransaksi()">
      Konfirmasi Transaksi
    </ion-button>
  </div>
</ion-content>
